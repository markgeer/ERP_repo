<div class="group-management-container">
  <p-toast></p-toast>
  
  <div class="header">
    <p-button label="Volver" icon="pi pi-arrow-left" styleClass="p-button-text" (onClick)="volver()"></p-button>
    <h1>Gestión del Grupo</h1>
  </div>

  <!-- Configuración del Grupo - Solo con permisos de edición -->
  <p-card header="Configuración del Grupo" *ifHasPermission="'group-edit'">
    <div class="grupo-config">
      <div class="field" *ngIf="!editandoGrupo">
        <label>Nombre:</label>
        <span>{{ grupo.nombre }}</span>
        <label>Descripción:</label>
        <span>{{ grupo.descripcion }}</span>
        <p-button label="Editar" icon="pi pi-pencil" styleClass="p-button-text" (onClick)="editandoGrupo = true"></p-button>
      </div>
      
      <div class="field" *ngIf="editandoGrupo">
        <label>Nombre del Grupo *</label>
        <input pInputText [(ngModel)]="grupo.nombre" />
        
        <label>Descripción</label>
        <textarea rows="3" pTextarea [(ngModel)]="grupo.descripcion"></textarea>
        
        <div class="form-actions">
          <p-button label="Cancelar" icon="pi pi-times" styleClass="p-button-secondary" (onClick)="editandoGrupo = false"></p-button>
          <p-button label="Guardar" icon="pi pi-check" styleClass="p-button-primary" (onClick)="guardarGrupo()"></p-button>
        </div>
      </div>
    </div>
  </p-card>

  <!-- Lista de Usuarios - Solo con permisos de administración -->
  <p-card header="Miembros del Grupo" *ifHasPermission="'group-view'">
    <div class="usuarios-header">
      <p-button 
        *ifHasPermission="'group-add'"
        label="Agregar Usuario" 
        icon="pi pi-plus" 
        (onClick)="abrirDialogAgregar()"
      ></p-button>
    </div>

    <p-table [value]="usuarios" [paginator]="true" [rows]="5">
      <ng-template pTemplate="header">
        <tr>
          <th>Usuario</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-usuario>
        <tr>
          <td>{{ usuario.username }}</td>
          <td>{{ usuario.fullName }}</td>
          <td>{{ usuario.email }}</td>
          <td><p-tag [value]="usuario.rol" [severity]="getRolSeverity(usuario.rol)"></p-tag></td>
          <td>
            <p-button 
              *ifHasPermission="'group-delete'"
              icon="pi pi-trash" 
              styleClass="p-button-rounded p-button-text p-button-danger"
              (onClick)="eliminarUsuario(usuario)"
            ></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>

  <!-- Diálogo para agregar usuario -->
  <p-dialog 
    header="Agregar Usuario al Grupo" 
    [(visible)]="mostrarDialogAgregar" 
    [modal]="true"
    [style]="{width: '400px'}"
  >
    <div class="p-fluid">
      <div class="field">
        <label>Email del usuario *</label>
        <input pInputText [(ngModel)]="nuevoUsuarioEmail" placeholder="usuario@email.com" />
      </div>
      
      <div class="field">
        <label>Rol</label>
        <p-select [options]="roles" [(ngModel)]="nuevoUsuarioRol" optionLabel="label"></p-select>
      </div>
    </div>
    
    <ng-template pTemplate="footer">
      <p-button label="Cancelar" icon="pi pi-times" styleClass="p-button-text" (onClick)="mostrarDialogAgregar = false"></p-button>
      <p-button label="Agregar" icon="pi pi-check" (onClick)="agregarUsuario()"></p-button>
    </ng-template>
  </p-dialog>
</div>
