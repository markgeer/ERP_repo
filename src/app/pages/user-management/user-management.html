<div class="user-container">
  <p-toast></p-toast>
  <p-confirmdialog></p-confirmdialog>

  <div class="page-header">
    <div>
      <h1>Gestión de Usuarios</h1>
      <p class="subtitle">Administra los usuarios del sistema</p>
    </div>
    <p-button 
      *ifHasPermission="'user:add'"
      label="Nuevo Usuario" 
      icon="pi pi-plus" 
      styleClass="p-button-primary"
      (onClick)="abrirNuevo()"
    ></p-button>
  </div>

  <!-- Tarjeta de resumen -->
  <div class="stats-grid">
    <div class="stat-card">
      <i class="pi pi-users"></i>
      <div>
        <span class="stat-value">{{ usuarios.length }}</span>
        <span class="stat-label">Total Usuarios</span>
      </div>
    </div>
  </div>

  <p-card>
    <p-table [value]="usuarios" [paginator]="true" [rows]="5">
      <ng-template pTemplate="header">
        <tr>
          <th>Usuario</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-u>
        <tr>
          <td>{{ u.username }}</td>
          <td>{{ u.fullName }}</td>
          <td>{{ u.email }}</td>
          <td>
            <div class="acciones">
              <p-button 
                *ifHasPermission="'user:edit'"
                icon="pi pi-pencil" 
                styleClass="p-button-rounded p-button-text"
                (onClick)="editarUsuario(u)"
              >✎</p-button>
              <p-button 
                *ifHasPermission="'user:delete'"
                icon="pi pi-trash" 
                styleClass="p-button-rounded p-button-text p-button-danger"
                (onClick)="eliminarUsuario(u)"
              >✖</p-button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>

  <!-- Diálogo para crear/editar usuario -->
  <p-dialog 
    [header]="editando ? 'Editar Usuario' : 'Nuevo Usuario'" 
    [(visible)]="dialogVisible" 
    [modal]="true" 
    [style]="{width: '550px'}"
  >
    <div class="p-fluid">
      <div class="form-row">
        <div class="field">
          <label>Usuario *</label>
          <input pInputText [(ngModel)]="usuarioForm.username" class="w-full" />
        </div>
        <div class="field">
          <label>Email *</label>
          <input pInputText [(ngModel)]="usuarioForm.email" class="w-full" />
        </div>
      </div>

      <div class="field">
        <label>Nombre completo *</label>
        <input pInputText [(ngModel)]="usuarioForm.fullName" class="w-full" />
      </div>

      <div class="form-row">
        <div class="field">
          <label>Teléfono</label>
          <input pInputText [(ngModel)]="usuarioForm.phone" class="w-full" />
        </div>
        <div class="field">
          <label>Dirección</label>
          <input pInputText [(ngModel)]="usuarioForm.address" class="w-full" />
        </div>
      </div>

      @if (!editando) {
        <div class="form-row">
          <div class="field">
            <label>Contraseña *</label>
            <input type="password" pInputText [(ngModel)]="usuarioForm.password" class="w-full" />
          </div>
          <div class="field">
            <label>Confirmar contraseña *</label>
            <input type="password" pInputText [(ngModel)]="usuarioForm.confirmPassword" class="w-full" />
          </div>
        </div>
      }

      <div class="field">
        <label>Permisos Globales</label>
        <div class="permisos-grid">
          @for (permiso of permisosDisponibles; track permiso.id) {
            <div class="permiso-item">
              <p-checkbox 
                [binary]="true" 
                [(ngModel)]="permiso.seleccionado"
                (onChange)="togglePermiso(permiso)"
              ></p-checkbox>
              <label>{{ permiso.nombre }}</label>
            </div>
          }
        </div>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="dialog-footer">
        <p-button label="Cancelar" icon="pi pi-times" styleClass="p-button-secondary" (onClick)="dialogVisible = false"></p-button>
        <p-button label="Guardar" icon="pi pi-check" styleClass="p-button-primary" (onClick)="guardar()"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
